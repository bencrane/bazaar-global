<!DOCTYPE html>

  <!-- Primary Meta Tags -->

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">

  <meta property="og:title" content="Bazaar Global">

  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20260914_3">

  <!-- Inline Critical CSS for Instant Accurate Rendering -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden; background-color: #03050d; color: #ffffff;
      font-family: 'Space Mono', monospace; -webkit-font-smoothing: antialiased;
    }
    #starfield { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
    .container {
      position: relative; z-index: 2; width: 100%; height: 100vh; height: 100dvh;
      display: flex; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box;
    }
    .frame {
      width: min(1140px, 90vw);
      height: clamp(110px, 24vh, 250px);
      border: 3.5px solid rgba(255, 255, 255, 0.52);
      display: flex; justify-content: center; align-items: center;
      padding: 10px 24px; background: rgba(3, 5, 13, 0.2);
      backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.4); box-sizing: border-box;
      transition: border-color 0.4s ease, box-shadow 0.4s ease;
    }
    .frame:hover { border-color: rgba(255, 255, 255, 0.8); box-shadow: 0 0 65px rgba(255, 255, 255, 0.14); }
    .title-svg {
      width: 86%; max-width: 960px; height: auto; max-height: 65%; display: block; overflow: visible; user-select: none;
    }
    .svg-title-text {
      font-family: 'Space Mono', monospace; font-weight: 400; font-size: 58px; letter-spacing: 0.32em;
      fill: #ffffff; text-anchor: middle;
    }
    .footer {
      position: fixed; bottom: 24px; left: 0; width: 100%; z-index: 2; text-align: center; pointer-events: none; padding: 0 16px; box-sizing: border-box;
    }
    .footer p {
      font-family: 'Space Mono', monospace; font-size: clamp(8px, 1.3vw, 11px); letter-spacing: 0.28em;
      color: rgba(255, 255, 255, 0.25); text-transform: uppercase; font-weight: 400;
    }
    @media (max-width: 640px) {
      .container { padding: 12px; }
      .frame { width: 90vw; height: clamp(95px, 20vh, 150px); padding: 8px 16px; border-width: 2.5px; }
      .title-svg { width: 85%; max-height: 62%; }
      .svg-title-text { font-size: 56px; letter-spacing: 0.28em; }
      .footer { bottom: 16px; }
      .footer p { font-size: 8px; letter-spacing: 0.16em; }
    }
  </style>
</head>
<body>
  <!-- Canvas for Starfield & Shooting Stars background -->
  <canvas id="starfield"></canvas>

  <!-- Main Content Container with Fluid Responsive SVG Wordmark -->
  <main class="container">
    <div class="frame">
      <h1 class="sr-only">Bazaar Global</h1>
      <svg class="title-svg" viewBox="0 0 820 80" preserveAspectRatio="xMidYMid meet" role="img" aria-label="BAZAAR GLOBAL">
        <text x="50%" y="54%" text-anchor="middle" dominant-baseline="middle" class="svg-title-text">BAZAAR GLOBAL</text>
      </svg>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <p>© 2026 BAZAAR GLOBAL LLC ALL RIGHTS RESERVED</p>
  </footer>

  <script src="script.js?v=20260914_3"></script>
</body>
</html>
